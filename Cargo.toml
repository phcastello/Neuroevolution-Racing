[workspace]
members = ["crates/neuroevolution", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "2d_bevy_render",
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    # WSLg's Wayland/Vulkan surface is lost during interactive resize with
    # Bevy 0.19.1; X11/XWayland remains stable and handles monitor selection.
    "x11",
    "custom_cursor",
    "sysinfo_plugin",
] }
avian2d = "0.7.0"
bevy_egui = "0.42.0"
egui_plot = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.0"
clap = { version = "4.5.47", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
rand_chacha = { version = "0.10.0", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
  opt-level = 0
  debug = 2
