[workspace]
members = ["crates/neuroevolution", "crates/app", "crates/rl"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_color"
] }
avian2d = { version = "0.7.0", default-features = false, features = ["2d", "f32", "parry-f32", "parallel", "xpbd_joints"] }
bevy_egui = "0.42.0"
egui_plot = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.0"
clap = { version = "4.5.47", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
rand_chacha = { version = "0.10.0", features = ["serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
  opt-level = 0
  debug = 2
